<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimônio</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      border-top: 5px solid #6b1d29;
    }

    .header {
      background-color: #A32B50;
      color: white;
      padding: 15px 20px;
      text-align: center;
    }

    .content {
      padding: 20px;
    }

    .image-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fafafa;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .item-image {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .info-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-top: 10px;
    }

    .info-item {
      flex: 1 1 45%;
      margin-bottom: 20px;
      padding: 15px;
      background-color: #f5efef;
      border-radius: 10px;
      border-left: 3px solid #A32B50;
      min-width: 150px;
    }

    .info-item strong {
      display: block;
      color: #A32B50;
      font-size: 1.2em;
      margin-bottom: 2px;
    }

    .info-item span {
      color: #000000;
      font-size: 1.1em;
      font-weight: 600;
    }

    .full-width-item {
      flex: 1 1 100%;
    }

    .id-tag {
      display: inline-block;
      background-color: #f2ae2e;
      color: #333;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1.4em;
    }

    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #bbb;
    }

    .logos img {
      height: 50px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="header">
      <div class="id-tag" id="id-tag">ID</div>
    </div>

    <div class="content">

      <div class="image-container">
        <img class="item-image" id="foto" alt="Foto do Patrimônio">
      </div>

      <div class="info-group">

        <div class="info-item full-width-item">
          <strong>Descrição</strong>
          <span id="descricao"></span>
        </div>

        <div class="info-item">
          <strong>Centro de Custo</strong>
          <span id="centro"></span>
        </div>

        <div class="info-item">
          <strong>Data de Aquisição</strong>
          <span id="data"></span>
        </div>

        <div class="info-item">
          <strong>Valor Estimado</strong>
          <span id="valor"></span>
        </div>

        <div class="info-item">
          <strong>Grupo</strong>
          <span id="grupo"></span>
        </div>

      </div>

      <div class="logos">
        <img src="layout/logo_hospital.png?raw=true" alt="Logo Hospital">
        <img src="layout/logo_mais_saude_completo2.png?raw=true" alt="Logo Instituto Mais Saúde">
      </div>

    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzp2-HARJhpxphmN-RUI8pqv-ClEWpWn_QUizDwkmAjR_fkmW8cCm0osRoPfRaVYGviYg/exec";

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // USAREMOS rowkey COMO ID
  const rowKey = getParam("id");

  if (!rowKey) {
    alert("RowKey não informado na URL. Use ?id=XXXXX");
  } else {
    fetch(`${API_URL}?id=${rowKey}`)
      .then(r => r.json())
      .then(d => preencher(d))
      .catch(() => alert("Erro ao carregar patrimônio"));
  }

  function preencher(d) {
    document.title = `${d.Descricao} - ${d['ID Patrimonio']}`;

    document.getElementById("id-tag").innerText = `ID: ${d['ID Patrimonio']}`;
    document.getElementById("descricao").innerText = d.Descricao || "";
    document.getElementById("centro").innerText = d['Centro de Custo'] || "";
    document.getElementById("data").innerText = formatarData(d['Data de Aquisição']);
    document.getElementById("valor").innerText = formatarMoeda(d.Valor);
    document.getElementById("grupo").innerText = d.Categoria || "";

    if (d.Foto) {
      const nomeFoto = d.Foto.split("/").pop();
      document.getElementById("foto").src = `fotos/${nomeFoto}?raw=true`;
    }
  }

  function formatarMoeda(v) {
    if (v === null || v === undefined || v === "") return "";
    return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function formatarData(d) {
    if (!d) return "";
    return new Date(d).toLocaleDateString("pt-BR");
  }
</script>
</body>
</html>
