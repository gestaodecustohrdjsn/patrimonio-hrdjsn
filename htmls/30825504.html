            justify-content: center;

            border-radius: 8px;

        }

        }

            background-color: #f2ae2e;
            color: #333;
            padding: 5px 5px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 2px;
            font-size: 1.4em;

        .logos {
